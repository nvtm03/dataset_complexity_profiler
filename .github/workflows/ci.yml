name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Bytecode compilation
        run: python -m compileall -q src research tests

      - name: Tests
        run: pytest -q

      - name: Build wheel and sdist
        run: |
          rm -rf dist/ build/
          python -m build
          tar -tzf dist/*.tar.gz | grep -E 'meta_model\.skops$|py\.typed$|tests/test_cli\.py$'

      - name: Wheel smoke test
        run: |
          pip uninstall -y dataset-complexity-profiler dataset_complexity_profiler
          pip install dist/*.whl
          cd /tmp
          dcp --help
          python -c "from dataset_complexity_profiler import DatasetProfiler; p = DatasetProfiler(); assert p.is_fitted, 'meta_model.skops missing from the wheel'"
