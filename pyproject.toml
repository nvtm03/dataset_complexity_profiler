[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset_complexity_profiler"
version = "0.1.3"
description = "Text dataset complexity profiler with a packaged meta-model for automatic embedding dimension recommendation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["nlp", "meta-learning", "dataset-profiling", "embeddings"]
dependencies = [
  "sentence-transformers>=2.2.2",
  "datasets>=2.14.5",
  "pymfe>=0.3.1",
  "scikit-learn>=1.2.2",
  "numpy>=1.24.0",
  "pandas>=1.5.3",
  "joblib>=1.2.0",
]

[tool.setuptools]
packages = ["dataset_complexity_profiler"]

[tool.setuptools.package-data]
dataset_complexity_profiler = ["*.pkl"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"

[dependency-groups]
dev = [
    "build>=1.4.4",
    "packaging>=26.2",
    "pkginfo>=1.12.1.2",
    "setuptools>=81.0.0",
    "twine>=6.2.0",
    "wheel>=0.47.0",
]
